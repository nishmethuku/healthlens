server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let client-side routing (or a hard refresh on "/") resolve
    # through index.html instead of a raw nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
