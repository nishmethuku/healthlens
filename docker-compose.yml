services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your .env}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      HEALTHLENS_API_KEY: ${HEALTHLENS_API_KEY:?set HEALTHLENS_API_KEY in your .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
    volumes:
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_HEALTHLENS_API_KEY: ${HEALTHLENS_API_KEY:?set HEALTHLENS_API_KEY in your .env}
    ports:
      - "5173:80"
    depends_on:
      - backend
